name: Paper V3 Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-v3-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas numpy

      - name: Engine self-test
        run: python kucoin_paper_engine_v3.py --selftest

      - name: Backtest self-test
        run: python paper_v3_backtest.py --selftest

      - name: Run backtest
        run: python paper_v3_backtest.py

      - name: Commit results
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add paper_v3_result.txt
          if [ -f paper_v3_trades.csv ]; then git add paper_v3_trades.csv; fi
          git commit -m "Paper v3 backtest result" || exit 0
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep $((RANDOM % 8 + 3))
          done
          exit 1
