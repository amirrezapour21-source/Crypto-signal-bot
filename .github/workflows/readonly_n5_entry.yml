name: Read-only N5 entry realism audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readonly-n5-entry
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy requests
      - name: N5 entry realism audit (read-only)
        run: python n5_entry_realism.py
