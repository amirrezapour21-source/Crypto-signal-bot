name: Daily Crypto Signal

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas numpy

      - name: Run signal bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crypto_signal_bot.py

      - name: Commit updated signal log
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          if [ -f signals_log.json ]; then
            git add signals_log.json
            git diff --cached --quiet || git commit -m "update signal log"
            git push
          else
            echo "امروز سیگنالی ثبت نشد، فایلی برای Commit وجود ندارد."
          fi
