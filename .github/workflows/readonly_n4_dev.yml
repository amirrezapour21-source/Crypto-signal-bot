name: Read-only N4-SD development

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readonly-n4-dev
  cancel-in-progress: false

jobs:
  dev:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy requests
      - name: N4-SD development run (read-only)
        run: python n4_sd_dev.py
