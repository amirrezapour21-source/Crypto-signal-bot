name: V4 SMC Cycle 1 (detection and causality only)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v4-smc-cycle1
  cancel-in-progress: false

jobs:
  cycle1:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install requests pandas numpy

      - name: Offline self-test (synthetic data only)
        run: python v4_smc_cycle1.py selftest

      - name: Cycle 1 TEST RUN
        id: run
        run: |
          set +e
          python v4_smc_cycle1.py 2>&1 | tee v4_smc_cycle1_console.log
          code=${PIPESTATUS[0]}
          echo "exit code: $code"
          exit $code

      - name: Commit v4_smc outputs only
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v4_smc_frozen_data.csv.gz v4_smc_cycle1_config.json v4_smc_cycle1_report.txt v4_smc_cycle1_events.jsonl.gz v4_smc_cycle1_console.log 2>/dev/null || true
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "v4_smc cycle1 outputs [skip ci]"
          git pull --rebase --autostash origin main
          git push origin main
