name: Read-only H-F forced-flow pilot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readonly-n5-pilot
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy requests
      - name: H-F forced-flow pilot run (read-only)
        run: python n5_forced_flow_pilot.py
