name: Read-only N1 FOMC holdout (single run)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readonly-n1-holdout
  cancel-in-progress: false

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy requests
      - name: N1 FOMC holdout, single registered run (read-only)
        run: python n1_fomc_holdout.py
