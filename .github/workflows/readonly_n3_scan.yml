name: Read-only N3 microstructure discovery scan

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readonly-n3-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy requests
      - name: N3 discovery scan (read-only)
        run: python n3_micro_scan.py
