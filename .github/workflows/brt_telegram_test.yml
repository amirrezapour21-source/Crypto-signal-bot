name: BRT-S Telegram Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas numpy

      - name: Send test messages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import crypto_signal_bot_brt_short_v1 as M
          pos = {"symbol": "XBTUSDTM", "entry": 100000.0, "sl": 101500.0, "tp": 97000.0, "risk": 1500.0}
          M.OUTBOX.append("🧪 <b>BRT-S TELEGRAM TEST</b>\n\nاین فقط یک پیام آزمایشی است (نمونه قالب، قیمت‌ها فرضی‌اند).")
          M.OUTBOX.append(M.msg_signal(pos))
          M.OUTBOX.append(M.msg_entry(pos))
          M.send_outbox()
          PY
