name: Read-only N7 execution-cost step 0 probe (single run)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readonly-n7-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy requests
      - name: N7 execution probe (read-only)
        run: python n7_exec_probe.py
