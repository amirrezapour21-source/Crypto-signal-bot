name: Read-only Audits A-N0 and C

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readonly-audits
  cancel-in-progress: false

jobs:
  audit_a_n0:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Audit A and N0 (read-only)
        run: python audit_a_n0.py

  audit_c:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy requests
      - name: Audit C parity (read-only)
        run: python audit_c_parity.py
