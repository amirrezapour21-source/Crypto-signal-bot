name: LVAR Exit Screen

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lvar-exit-screen
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas numpy

      - name: Self-test R2
        run: python lvar_exit_screen.py R2 --selftest

      - name: Self-test BE
        run: python lvar_exit_screen.py BE --selftest

      - name: Self-test HALF
        run: python lvar_exit_screen.py HALF --selftest

      - name: Self-test TRAIL
        run: python lvar_exit_screen.py TRAIL --selftest

      - name: Run R2
        run: python lvar_exit_screen.py R2

      - name: Run BE
        if: always()
        run: python lvar_exit_screen.py BE

      - name: Run HALF
        if: always()
        run: python lvar_exit_screen.py HALF

      - name: Run TRAIL
        if: always()
        run: python lvar_exit_screen.py TRAIL

      - name: Commit results
        if: always()
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add lvar_exit_*_result.txt lvar_exit_*_trades.csv || true
          git commit -m "LVAR exit screen results" || exit 0
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep $((RANDOM % 8 + 3))
          done
          exit 1
