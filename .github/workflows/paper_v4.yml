name: Candidate 11 Paper Trading

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate11-paper
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy requests

      - name: Run Candidate 11
        id: run
        continue-on-error: true
        run: python crypto_signal_bot_v4.py

      - name: Save paper state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidate11_paper_state.json
          git diff --cached --quiet || git commit -m "Update Candidate 11 paper state"
          git push

      - name: Fail if engine failed
        if: steps.run.outcome == 'failure'
        run: exit 1
