name: Candidate 11 Paper Trading

on:
  schedule:
    # NOTE: GitHub scheduled runs are best-effort. Observed 2026-10-03..10-20: about 90 runs instead of ~1,560.
    # Forward data is therefore delay-filtered by MAX_ENTRY_DELAY_MIN=90. Cron intentionally unchanged.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate11-paper
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy requests

      - name: Run Candidate 11
        id: run
        continue-on-error: true
        run: python crypto_signal_bot_v4.py

      - name: Save paper state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidate11_paper_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Candidate 11 paper state"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase origin main && git push; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            [ "$ok" = "1" ] || { echo "PUSH_FAILED_AFTER_3_ATTEMPTS"; exit 1; }
          fi

      - name: Fail if engine failed
        if: steps.run.outcome == 'failure'
        run: exit 1
