  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.11'

  - name: Install dependencies
    run: pip install requests pandas numpy

  - name: Self-test
    run: python lvar_daily_selftest.py

  - name: Run backtest
    env:
      BT_DAYS: ${{ github.event.inputs.days }}
    run: python lvar_daily_backtest.py

  - name: Commit results
    run: |
      git config user.name "signal-bot"
      git config user.email "signal-bot@users.noreply.github.com"
      git add lvar_daily_result.txt lvar_daily_trades.csv
      git commit -m "LVAR daily backtest result" || exit 0
      for i in 1 2 3 4 5 6; do
        git pull --rebase origin main && git push origin main && exit 0
        sleep $((RANDOM % 8 + 3))
      done
      exit 1
