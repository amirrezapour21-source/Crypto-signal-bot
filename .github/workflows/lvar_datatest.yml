name: LVAR Data Test

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lvar-datatest
  cancel-in-progress: false

jobs:
  datatest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run data test
        run: python lvar_datatest.py

      - name: Commit results
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add lvar_datatest_result.txt
          git commit -m "LVAR data test result" || exit 0
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep $((RANDOM % 8 + 3))
          done
          exit 1
