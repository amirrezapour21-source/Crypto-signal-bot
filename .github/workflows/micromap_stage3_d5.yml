          lp = os.path.join(OUT, "entry1_ledger_baseline.jsonl"); lt = "".join(json.dumps(r, sort_keys=True) + "\n" for r in recs); open(lp, "w").write(lt); lsha = hashlib.sha256(lt.encode()).hexdigest()
          print("D5-11a BASELINE ENTRY-1 LEDGER: %d records (all required fields present or explicitly null), unique record ids, file sha256 %s" % (len(recs), lsha))
          cp0 = {"schema": "micromap-checkpoint-v1", "checkpoint_index": 0, "kind": "BASELINE_HISTORICAL_FROZEN_NOT_REGISTERED", "prev_checkpoint_sha256": None, "prospective_start_ms": P0, "prospective_start_utc": _iso(P0),
                 "provenance": {"snapshot_run_id": expect[2], "snapshot_master_sha256": expect[0], "contracts_sha256": expect[1], "stage3_run_id": S3_RUN, "stage3_events_sha256": cfg["events_sha"], "stage3_counts_sha256": cfg["counts_sha"], "stage3_code_sha256": cj["code_sha256"],
                                "audit_run_id": THIS_RUN, "audit_repo_head": THIS_SHA, "ledger_sha256": lsha},
                 "entry1_counts": {"%s|%s" % (p, d_): {"triggers": sum(1 for r in recs if r["split"] == p and r["direction"] == d_), "skips": sum(1 for r in recs if r["split"] == p and r["direction"] == d_ and r["status"] == "skipped"), "fills": sum(1 for r in recs if r["split"] == p and r["direction"] == d_ and r["status"] == "filled")} for p in ("IS", "EMB", "HO") for d_ in ("L", "S")},
                 "gate": {"is_filled_pf": gis, "is_required": 200, "ho_filled_pf": gho, "ho_required": 100, "status": gate_state}, "prospective": {"observations": 0, "note": "none ingested; reported separately from IS/EMB/HO"}, "failures": []}
          cs_ = json.dumps(cp0, sort_keys=True, indent=1); cp0["content_sha256"] = hashlib.sha256(cs_.encode()).hexdigest()
          open(os.path.join(OUT, "checkpoint_0_baseline.json"), "w").write(json.dumps(cp0, sort_keys=True, indent=1))
          print("D5-11b CHECKPOINT-0 BASELINE RECORD (canonical content sha256 %s; kind says NOT REGISTERED: it becomes the genesis of a hash chain only if the designer authorises it)" % cp0["content_sha256"])
          print("LIMITATIONS: (1) no MicroMAP monitoring or prospective-collection workflow exists; all MicroMAP workflows are manual; (2) split, gap status, ATR and fill stop_pct are not stored on Entry-1 events and must be derived or reconstructed; (3) no KuCoin request was made, so prospective data availability and the current 15m history depth were not re-tested; (4) artifact expiry is read from GitHub metadata and is not extended by this audit; (5) the protected-file hashes are a baseline without an earlier reference; (6) descriptive verification only - no P&L, expectancy, significance, threshold test or extrapolation.")
          res = {"label": "READ-ONLY D5 - forward-monitoring integrity audit; no rule, state or workflow change", "P0": P0, "gate": cp0["gate"], "selftest": [(a, b, c_) for a, b, c_ in tests], "ledger_sha256": lsha, "checkpoint0_sha256": cp0["content_sha256"], "workflows": wf_rows}
          js = json.dumps(res, sort_keys=True, indent=1, default=str); open(os.path.join(OUT, "d5_audit.json"), "w").write(js)
          print("AUDIT_RESULTS_SHA256", hashlib.sha256(js.encode()).hexdigest()); print("AUDIT_DONE (read-only; engine, parameters, workflows and state untouched)")
          PYEOF
          echo "AUDIT_CODE_SHA256_COMPUTED=$(sha256sum stage3_d5_forward_integrity.py | cut -d' ' -f1)"
          test "$(sha256sum stage3_d5_forward_integrity.py | cut -d' ' -f1)" = "$AUDIT_CODE_SHA256" || { echo "ABORT_AUDIT: code hash mismatch"; exit 2; }

      - name: Run D5 forward-monitoring integrity audit
        shell: bash
        env:
          STAGE3_RUN_ID: ${{ steps.find.outputs.run_id }}
        run: |
          export THIS_AUDIT_RUN_ID=$GITHUB_RUN_ID
          DL_DIR=dl RES_DIR=s3res OUT_DIR=audit_out WF_DIR=repo/.github/workflows REPO_DIR=repo META_DIR=meta python3 -I stage3_d5_forward_integrity.py 2>&1 | tee audit_log.txt
          cp audit_log.txt audit_out/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mm-stage3-d5
          path: audit_out/
          retention-days: 90
          if-no-files-found: ignore
