name: MicroMAP Stage 3 D5 forward-monitoring integrity audit and checkpoint evidence (read-only; artifacts only, no repo commit, no rule change)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AUDIT_CODE_SHA256: "24c24944ad9ab763b47cee2ab3e8f895fb822a688be9927ea0e337ec232fba92"
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Locate the Stage 3 run (actual run ID) and its artifact
        id: find
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "THIS_AUDIT_RUN_ID=$GITHUB_RUN_ID"
          gh run list -R "$GITHUB_REPOSITORY" --workflow micromap_stage3.yml --limit 30 --json databaseId,number,headSha,conclusion,status,createdAt,url > runs.json
          python3 - <<'PY'
          import json, os, sys
          runs = [r for r in json.load(open("runs.json")) if r["conclusion"] == "success"]
          print("SUCCESSFUL_STAGE3_RUNS:", json.dumps(runs))
          if len(runs) != 1:
              print("ABORT_AUDIT: expected exactly one successful Stage 3 run, found", len(runs)); sys.exit(2)
          r = runs[0]
          print("STAGE3_RUN_ID", r["databaseId"], "| run number", r["number"], "| commit", r["headSha"], "| created", r["createdAt"], "| url", r["url"])
          open(os.environ["GITHUB_OUTPUT"], "a").write("run_id=%s\n" % r["databaseId"])
          PY
          RID=$(grep -o 'run_id=[0-9]*' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RID/artifacts" > arts.json
          RID=$RID python3 - <<'PY'
          import json, os
          repo = os.environ["GITHUB_REPOSITORY"]; rid = os.environ["RID"]
          for a in json.load(open("arts.json"))["artifacts"]:
              print("STAGE3_ARTIFACT name=%s id=%s size_bytes=%s digest=%s created=%s expires=%s expired=%s" % (a["name"], a["id"], a["size_in_bytes"], a.get("digest"), a["created_at"], a["expires_at"], a["expired"]))
              print("STAGE3_ARTIFACT_WEB_URL https://github.com/%s/actions/runs/%s/artifacts/%s" % (repo, rid, a["id"]))
          PY

      - uses: actions/download-artifact@v4
        with:
          name: mm-stage3-15m-results
          path: s3res
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          pattern: mm-snap-15m-*
          path: dl
          run-id: 39046246188
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          pattern: mm-snap-meta
          path: dl
          run-id: 39046246188
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          pattern: mm-snap-manifest
          path: dl
          run-id: 39046246188
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: repo
          persist-credentials: false

      - name: Collect read-only GitHub metadata
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          S3RUN: ${{ steps.find.outputs.run_id }}
        run: |
          mkdir -p meta
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[]' | jq -s '{artifacts: .}' > meta/arts_all.json || echo '{}' > meta/arts_all.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/39046246188" --jq '{id,created_at,event,conclusion,head_sha,path,name}' > meta/snapshot_run.json || echo '{}' > meta/snapshot_run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$S3RUN" --jq '{id,created_at,event,conclusion,head_sha,path,name}' > meta/stage3_run.json || echo '{}' > meta/stage3_run.json
          gh run list -R "$GITHUB_REPOSITORY" --limit 200 --json databaseId,name,workflowName,createdAt,conclusion,event,headSha > meta/runs_all.json || echo '[]' > meta/runs_all.json
          ls -l meta

      - name: Write audit code and verify its hash
        shell: bash
        run: |
          cat > stage3_d5_forward_integrity.py <<'PYEOF'
          # MicroMAP Stage 3 - READ-ONLY diagnostic D5: forward-monitoring integrity audit and checkpoint-plan evidence.
          # Uses the frozen snapshot (hash-verified), the frozen Stage 3 events/counts, repo workflow files (read-only checkout) and GitHub run/artifact metadata (read-only API).
          # No engine import, no strategy re-run, no parameter change, no threshold test, no P&L, no data fetch from KuCoin, no state change. Descriptive and verification only.
          import os, sys, json, gzip, glob, hashlib, collections, statistics, datetime as _dt
          FROZEN_MASTER = "4c3350b8a6ae095446aa6021d5c34b198802281c78545ece68c5fa9aba9ad82b"
          FROZEN_CONTRACTS = "39c3197a3ea104bf08ead742298bdc0d749362f0686ad08b4496283f0fc31878"
          FROZEN_RUN = "39046246188"
          FROZEN = {"events_sha": "d35599bc48976960caa54680eb9d2e39852aff55f94522ef36aeee5727fba1ee", "counts_sha": "5651c7e2d8e41decb3c646741f5224213d37ba7e72c7754458b2ca4e6a91e826",
                    "is_end": 1767556800000, "emb_end": 1768161600000, "n_trig": 175, "n_skip": 162, "n_fill": 13}
          TF = 15; STEP = TF * 60000; TOL = 2e-6   # stored stop_pct is rounded to 6 decimals; tolerance in percentage points
          MOCK = os.environ.get("AUDIT_MOCK") == "1"; cfg = dict(FROZEN); expect = (FROZEN_MASTER, FROZEN_CONTRACTS, FROZEN_RUN)
          if MOCK:
              cfg.update(events_sha=os.environ["EXPECT_EVENTS_SHA"], counts_sha=os.environ["EXPECT_COUNTS_SHA"], is_end=int(os.environ["IS_END"]), emb_end=int(os.environ["EMB_END"]), n_trig=None, n_skip=None, n_fill=None)
              expect = (os.environ["EXPECT_MASTER"], os.environ["EXPECT_CONTRACTS"], os.environ["EXPECT_RUN"])
          DL = os.environ.get("DL_DIR", "dl"); D = os.environ.get("RES_DIR", "s3res"); OUT = os.environ.get("OUT_DIR", "audit_out"); os.makedirs(OUT, exist_ok=True)
          def _sha_file(p):
              h = hashlib.sha256()
              with open(p, "rb") as f:
                  for c in iter(lambda: f.read(1 << 20), b""): h.update(c)
              return h.hexdigest()
          def _d(ms): return _dt.datetime.fromtimestamp(ms / 1000, _dt.timezone.utc).strftime("%Y-%m-%d %H:%M")
          def abort(msg):
              print("ABORT_STAGE3:", msg); print("NO_RESULTS_PRODUCED"); sys.exit(2)

          def _analyze(tsv, tf):
              step = tf * 60000; tsv = sorted(tsv); off = bad = zero = 0; runs = []; prev = None
              for t, o, h, l, c, v in tsv:
                  if t % step != 0: off += 1
                  if min(o, h, l, c) <= 0 or h < max(o, c, l) or l > min(o, c, h): bad += 1
                  if v == 0: zero += 1
                  if prev is not None and t - prev > step: runs.append([prev + step, (t - prev) // step - 1])
                  prev = t
              return {"rows": len(tsv), "first_ts": tsv[0][0] if tsv else None, "last_ts": tsv[-1][0] if tsv else None,
                      "off_grid": off, "ohlc_bad": bad, "zero_vol": zero,
                      "ms_units": all(1e12 < r[0] < 4e12 for r in tsv) if tsv else None,
                      "interior_missing_bars": sum(r[1] for r in runs), "interior_missing_runs": runs}

          def verify_and_load(DL, expect_master, expect_contracts, expect_run):
              """Verify every required 15m artifact against the manifest. Abort on any problem. Returns (man, contracts, universe, metas)."""
              mp = glob.glob(DL + "/*/manifest.json")
              if len(mp) != 1: abort("manifest.json not found exactly once (%d)" % len(mp))
              man = json.load(open(mp[0]))
              files = [tuple(x) for x in man["files"]]; fh = dict(files)
              master = hashlib.sha256("".join("%s  %s\n" % (h, r) for r, h in sorted(files)).encode()).hexdigest()
              if master != man["master_sha256"]: abort("manifest internal master hash mismatch %s" % master)
              if master != expect_master: abort("manifest master %s != frozen %s" % (master, expect_master))
              if str(man.get("run_id")) != expect_run: abort("manifest run_id %s != %s" % (man.get("run_id"), expect_run))
              if man["tf_results"]["15"]["verdict"] != "PASS": abort("manifest 15m verdict not PASS")
              print("V1 manifest ok: run_id", man["run_id"], "master", master, "manifest_files", len(files))
              cj = [r for r, h in files if r.endswith("contracts_active_55.json")]
              if len(cj) != 1: abort("contract snapshot not in manifest")
              cp = os.path.join(DL, cj[0])
              if not os.path.exists(cp): abort("contract snapshot file missing")
              if _sha_file(cp) != fh[cj[0]] or fh[cj[0]] != expect_contracts: abort("contract snapshot hash mismatch")
              contracts = json.load(open(cp)); universe = list(contracts["universe"])
              if len(universe) != 55 or len(contracts["contracts"]) < 55 or contracts["missing"]: abort("contract snapshot universe/missing problem")
              print("V2 contract snapshot ok sha", fh[cj[0]], "symbols", len(universe))
              exp15 = {r for r, h in files if "/" in r and r.split("/")[0].startswith("mm-snap-15m-")}
              if len(exp15) != 3 * len(universe): abort("manifest 15m file count %d != %d" % (len(exp15), 3 * len(universe)))
              present = {os.path.relpath(p, DL) for p in glob.glob(DL + "/mm-snap-15m-*/*")}
              if present - exp15: abort("unexpected extra files in 15m artifacts: %s" % sorted(present - exp15)[:5])
              if exp15 - present: abort("missing 15m files: %s" % sorted(exp15 - present)[:5])
              metas = {}; nbad = 0
              for sym in universe:
                  mrel = [r for r in exp15 if r.endswith("/%s_15m.meta.json" % sym)]
                  if len(mrel) != 1: abort("meta missing for " + sym)
                  dirn = os.path.dirname(mrel[0]); base = "%s_15m" % sym
                  for suf in (".csv.gz", ".calls.csv", ".meta.json"):
                      rel = dirn + "/" + base + suf
                      if _sha_file(os.path.join(DL, rel)) != fh[rel]: abort("file hash != manifest: " + rel)
                  m = json.load(open(os.path.join(DL, mrel[0])))
                  if m["sha256_csv_gz"] != fh[dirn + "/" + base + ".csv.gz"] or m["sha256_calls"] != fh[dirn + "/" + base + ".calls.csv"]: abort("meta hash fields != manifest: " + sym)
                  raw = gzip.decompress(open(os.path.join(DL, dirn, base + ".csv.gz"), "rb").read())
                  if hashlib.sha256(raw).hexdigest() != m["sha256_csv_raw"]: abort("raw csv hash mismatch " + sym)
                  tsv = []
                  for ln in raw.decode().split("\n")[1:]:
                      if ln:
                          f = ln.split(","); tsv.append((int(f[0]), float(f[1]), float(f[2]), float(f[3]), float(f[4]), float(f[5])))
                  an = _analyze(tsv, TF)
                  if json.loads(json.dumps(an)) != m["integrity"]: abort("integrity recompute differs " + sym)
                  if not m["complete"] or m["integrity"]["off_grid"] or m["integrity"]["ohlc_bad"] or m["integrity"]["rows"] == 0: abort("meta integrity flags " + sym)
                  if m["end_ms_exclusive"] != man["end_ms_exclusive"] or m["tf_min"] != TF or m["symbol"] != sym: abort("meta identity mismatch " + sym)
                  if len({t[0] for t in tsv}) != len(tsv) or [t[0] for t in tsv] != sorted(t[0] for t in tsv): abort("timestamps not unique/sorted " + sym)
                  metas[sym] = (m, dirn, base)
              print("V3 all", len(universe), "symbols: 165 files hash==manifest, raw hash, integrity recompute, complete, no off-grid/ohlc-bad: PASS")
              return man, contracts, universe, metas

          def read_series(DL, dirn, base):
              raw = gzip.decompress(open(os.path.join(DL, dirn, base + ".csv.gz"), "rb").read()).decode().split("\n")[1:]
              ts = []; O = []; H = []; L = []; C = []
              for ln in raw:
                  if ln:
                      f = ln.split(","); ts.append(int(f[0])); O.append(float(f[1])); H.append(float(f[2])); L.append(float(f[3])); C.append(float(f[4]))
              return ts, O, H, L, C



          import re, subprocess, copy, time
          NOW = _dt.datetime.now(_dt.timezone.utc)
          WD = os.environ.get("WF_DIR", "repo/.github/workflows"); REPO = os.environ.get("REPO_DIR", "repo"); META = os.environ.get("META_DIR", "meta")
          THIS_RUN = os.environ.get("THIS_AUDIT_RUN_ID", "unknown"); S3_RUN = os.environ.get("STAGE3_RUN_ID", "unknown"); THIS_SHA = os.environ.get("GITHUB_SHA", "unknown")
          def _iso(ms): return _dt.datetime.fromtimestamp(ms / 1000, _dt.timezone.utc).strftime("%Y-%m-%d %H:%M:%S")
          def _jload(name):
              p = os.path.join(META, name)
              if not os.path.exists(p): return None
              try: return json.load(open(p))
              except Exception as ex: return {"_error": str(ex)}
          print("D5 START | audit run id %s | repo head %s | now %s UTC" % (THIS_RUN, THIS_SHA, NOW.strftime("%Y-%m-%d %H:%M:%S")))
          # ---------------- D5-1 provenance (abort on any failure) ----------------
          ev_p, ct_p = os.path.join(D, "events.jsonl.gz"), os.path.join(D, "stage3_counts.json")
          for p in (ev_p, ct_p):
              if not os.path.exists(p): abort("missing " + p)
          if _sha_file(ev_p) != cfg["events_sha"]: abort("events hash mismatch %s" % _sha_file(ev_p))
          if _sha_file(ct_p) != cfg["counts_sha"]: abort("counts hash mismatch %s" % _sha_file(ct_p))
          print("D5-1a Stage 3 result files match the frozen hashes: events", cfg["events_sha"], "counts", cfg["counts_sha"])
          man, contracts, universe, metas = verify_and_load(DL, expect[0], expect[1], expect[2])
          P0 = int(man["end_ms_exclusive"])
          if not MOCK and P0 != 1792195200000: abort("snapshot end_ms_exclusive %s != frozen 1792195200000" % P0)
          cj = json.load(open(ct_p))
          def provenance_failures(cj, expect, man, cfg, mock):
              f = []
              if cj.get("mock") and not mock: f.append("counts.mock flag is true in a real run")
              if cj.get("snapshot_master_sha256") != expect[0]: f.append("counts.snapshot_master_sha256 != frozen")
              if cj.get("contracts_sha256") != expect[1]: f.append("counts.contracts_sha256 != frozen")
              if str(cj.get("snapshot_run_id")) != expect[2]: f.append("counts.snapshot_run_id != frozen")
              if cj.get("timeframe") != "15m": f.append("counts.timeframe != 15m")
              if cj.get("causality_verdict") != "PASS": f.append("counts.causality_verdict != PASS")
              if cj.get("outcome_reconciliation_failures") != []: f.append("counts.outcome_reconciliation_failures not empty")
              sp = cj.get("frozen_split_constants", {}); sp2 = cj.get("split", {})
              if sp2.get("end_ms_exclusive") != int(man["end_ms_exclusive"]) or sp2.get("is_end_ms") != cfg["is_end"] or sp2.get("embargo_end_ms") != cfg["emb_end"]: f.append("counts.split != frozen split_constants_mismatch")
              if not mock:
                  for k in ("end_ms_exclusive", "is_end_ms", "embargo_end_ms", "span_start_ms"):
                      if sp.get(k) != sp2.get(k): f.append("counts.split != counts.frozen_split_constants (%s) split_constants_mismatch" % k)
                  if sp.get("span_start_ms") != 1730599200000: f.append("span_start != frozen split_constants_mismatch")
                  if cj.get("code_sha256") != "3ae707caa684a6fbdd288131534aeb6a08dad2464323de789600ac2450f4d7d1": f.append("counts.code_sha256 != frozen 3ae707ca...")
              g = cj.get("gate", {})
              if g.get("need_is") != 200 or g.get("need_ho") != 100: f.append("gate requirements != 200/100")
              return f
          pf_ = provenance_failures(cj, expect, man, cfg, MOCK)
          if pf_: abort("provenance/configuration checks failed: %s" % pf_)
          print("D5-1b counts-file provenance PASS: snapshot run %s master %s contracts %s | Stage 3 code_sha256 %s | spec_hashes %s | split constants span_start %s end_excl %s is_end %s embargo_end %s | gate need %s/%s | interp %s" % (
              cj["snapshot_run_id"], cj["snapshot_master_sha256"], cj["contracts_sha256"], cj["code_sha256"], json.dumps(cj["spec_hashes"], sort_keys=True), cj["split"]["span_start_ms"], cj["split"]["end_ms_exclusive"], cj["split"]["is_end_ms"], cj["split"]["embargo_end_ms"], cj["gate"]["need_is"], cj["gate"]["need_ho"], json.dumps(cj["interp"], sort_keys=True)))
          print("D5-1c PROSPECTIVE START P0 = frozen snapshot end_ms_exclusive = %d = %s UTC (spike-start timestamp >= P0 => prospective; < P0 => frozen historical)" % (P0, _iso(P0)))
          # ---------------- D5-2 snapshot coverage ----------------
          firsts = []; lasts = collections.Counter(); rows_ = []; short = []; imiss = 0; over = []
          for sym in universe:
              m = metas[sym][0]["integrity"]; firsts.append(m["first_ts"]); lasts[m["last_ts"]] += 1; rows_.append(m["rows"]); imiss += m["interior_missing_bars"]
              if m["last_ts"] >= P0: over.append(sym)
              if m["last_ts"] != P0 - STEP: short.append((sym, (P0 - STEP - m["last_ts"]) // STEP))
          print("D5-2 SNAPSHOT COVERAGE (15m, %d symbols): first candle min %s max %s | rows min %d median %d max %d total %d | interior missing bars total %d | last candle values: %s | symbols whose last candle != P0-15m: %d %s | symbols with a candle at/after P0: %d" % (
              len(universe), _iso(min(firsts)), _iso(max(firsts)), min(rows_), statistics.median(rows_), max(rows_), sum(rows_), imiss, ", ".join("%s x%d" % (_iso(k), v) for k, v in sorted(lasts.items())), len(short), short[:8], len(over)))
          if over: abort("snapshot contains candles at/after P0: %s" % over[:5])
          # ---------------- D5-3 event ledger checks (reused by the self-test) ----------------
          BASE = ["i", "ts", "t", "d", "sym"]
          REQ = {"spike_detected": BASE + ["n", "atr_gap", "stratum"], "spike_run_rejected": BASE + ["n", "atr_gap", "reason", "stratum"], "channel_armed": BASE + ["stratum"], "channel_cancel": BASE + ["reason"],
                 "entry_trigger": BASE + ["no"], "minstop_skip": BASE + ["no", "stop_pct"], "fill": BASE + ["no", "gap_fill", "stratum", "pf"], "outcome": BASE + ["no", "code", "tp1"], "tp1_reached": BASE + ["no"],
                 "reentry_armed": BASE + ["no"], "reentry_timeout": BASE + ["no"], "three_stop_invalid": BASE, "gap_discard": BASE + ["phase"], "pending_end": BASE + ["phase", "end_marker"]}
          VOCAB = {"channel_cancel.reason": {"too_long", "higher_high", "too_wide", "pullback"}, "spike_run_rejected.reason": {"longer_than_max"}, "gap_discard.phase": {"spike", "channel", "position", "rewait", "rearmed"},
                   "pending_end.phase": {"channel", "position", "rewait", "rearmed"}, "stratum": {"Asia", "London", "NY", "Late"},
                   "outcome.code": {"SL_BEFORE_TP1", "STOP_ON_FILL_CANDLE", "TP1_THEN_TP2", "TP1_THEN_SL", "TIMESTOP_BEFORE_TP1", "TP1_THEN_TIMESTOP", "GAP_DISCARD_IN_POSITION", "CENSORED_END"}}
          def period_of_(ts, c): return "IS" if ts < c["is_end"] else ("EMB" if ts < c["emb_end"] else "HO")
          def ledger_check(events, cj, tsv, universe, P0, c):
              """Returns (failure_codes: list of (code, detail), summary dict). Pure function; never writes anything."""
              F = []; uni = set(universe)
              seen = collections.Counter(); cur = {}; last_i = {}; trig = {}; skip = {}; fill = {}; trig_all = collections.Counter(); spikes = collections.Counter()
              obs_vocab = collections.defaultdict(collections.Counter); evtypes = collections.Counter()
              for e in events:
                  t = e.get("t"); evtypes[t] += 1
                  if t not in REQ: F.append(("unknown_event_type", str(t))); continue
                  miss = [k for k in REQ[t] if k not in e or e[k] is None]
                  if miss: F.append(("missing_field", "%s %s" % (t, miss))); continue
                  s = e["sym"]; ts = e["ts"]
                  if s not in uni: F.append(("unknown_symbol", s)); continue
                  if not isinstance(ts, int) or isinstance(ts, bool) or ts % STEP != 0 or not isinstance(e["i"], int) or e["d"] not in (1, -1): F.append(("bad_field_type_or_grid", "%s %s" % (t, s)))
                  if isinstance(ts, int) and ts >= P0: F.append(("event_at_or_after_P0", "%s %s %s" % (t, s, ts)))
                  if "no" in e and (not isinstance(e["no"], int) or not 1 <= e["no"] <= 3): F.append(("no_out_of_range", "%s %s" % (t, e["no"])))
                  k = json.dumps(e, sort_keys=True); seen[k] += 1
                  if seen[k] == 2: F.append(("duplicate_event", "%s %s i=%s ts=%s" % (t, s, e["i"], ts)))
                  if s in last_i and e["i"] < last_i[s]: F.append(("event_order", "%s %s" % (t, s)))
                  last_i[s] = max(last_i.get(s, -1), e["i"])
                  if t in ("entry_trigger", "minstop_skip", "fill"):
                      if e["i"] >= len(tsv[s]) or tsv[s][e["i"]] != ts: F.append(("ts_not_candle_ts", "%s %s i=%s" % (t, s, e["i"])))
                  for fld, vk in (("reason", t + ".reason"), ("phase", t + ".phase"), ("code", t + ".code"), ("stratum", "stratum")):
                      if fld in e and e[fld] is not None:
                          obs_vocab[vk][e[fld]] += 1
                          if vk in VOCAB and e[fld] not in VOCAB[vk]: F.append(("unknown_code", "%s=%s" % (vk, e[fld])))
                  if t == "spike_detected":
                      spikes[(s, ts, e["d"])] += 1
                      if spikes[(s, ts, e["d"])] == 2: F.append(("duplicate_spike", "%s %s" % (s, ts)))
                      cur[s] = e
                  if t in ("entry_trigger", "minstop_skip", "fill"):
                      key = (s, e["i"], e["no"]); tgt = {"entry_trigger": trig, "minstop_skip": skip, "fill": fill}[t]
                      if key in tgt: F.append(("duplicate_entry_key", "%s %s" % (t, key)))
                      sp = cur.get(s)
                      if sp is None: F.append(("entry_without_spike", "%s %s" % (t, key))); continue
                      tgt[key] = {"e": e, "spike": sp, "per": period_of_(sp["ts"], c)}
              for key in trig:
                  if (key in skip) == (key in fill): F.append(("trigger_not_skip_xor_fill", str(key)))
              for key in list(skip) + list(fill):
                  if key not in trig: F.append(("skip_or_fill_without_trigger", str(key)))
                  else:
                      ee = (skip.get(key) or fill.get(key))["e"]
                      if ee["ts"] != trig[key]["e"]["ts"] or ee["d"] != trig[key]["e"]["d"]: F.append(("trigger_pair_mismatch", str(key)))
              # counts reconciliation vs the frozen counts file (period x direction)
