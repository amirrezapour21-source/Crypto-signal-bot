name: LVAR Backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: "History length in days"
        required: false
        default: "180"

permissions:
  contents: write

concurrency:
  group: lvar-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas numpy

      - name: Run backtest
        env:
          BT_DAYS: ${{ github.event.inputs.days }}
        run: python lvar_backtest.py

      - name: Commit results
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add lvar_backtest_result.txt lvar_backtest_trades.csv
          git commit -m "LVAR backtest result" || exit 0
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep $((RANDOM % 8 + 3))
          done
          exit 1
